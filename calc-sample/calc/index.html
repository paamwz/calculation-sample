<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <title>計算機</title>
        <style>
            button {
                width: 50px; 
                height: 50px; 
                margin: 2px;
            }
            #display {
                text-align: center; 
                min-width: 200px; 
                width: fit-content; 
                height: fit-content; 
                margin: 0 auto;
                font-weight: 500;
                font-size: 120%;
            }
        </style>
    </head>
    <body>
        <div class="alert alert-light" role="alert" id="display">
            Welcome!! This is a very simple calculator.
        </div>
    <div class = "js-calculator" id = "calcButtons">
        <div class="d-flex justify-content-center">
            <button type="button" class="btn btn-primary" id="7" data-content="7">7</button>
            <button type="button" class="btn btn-primary" id="8" data-content="8">8</button>
            <button type="button" class="btn btn-primary" id="9" data-content="9">9</button>
            <button type="button" class="btn btn-secondary" id="+" data-content="+">+</button>
        </div>
          
        <div class="d-flex justify-content-center">
            <button type="button" class="btn btn-primary" id="4" data-content="4">4</button>
            <button type="button" class="btn btn-primary" id="5" data-content="5">5</button>
            <button type="button" class="btn btn-primary" id="6" data-content="6">6</button>
            <button type="button" class="btn btn-secondary" id="-" data-content="-">-</button>    
        </div>
          
        <div class="d-flex justify-content-center">
            <button type="button" class="btn btn-primary" id="1" data-content="1">1</button>
            <button type="button" class="btn btn-primary" id="2" data-content="2">2</button>
            <button type="button" class="btn btn-primary" id="3" data-content="3">3</button>
            <button type="button" class="btn btn-secondary" id="*" data-content="*">×</button>  
        </div>
          
        <div class="d-flex justify-content-center">
            <button type="button" class="btn btn-danger"  id="C" data-content="C">C</button>
            <button type="button" class="btn btn-primary" id="0" data-content="0">0</button>
            <button type="button" class="btn btn-success" id="=" data-content="=">=</button>
            <button type="button" class="btn btn-secondary" id="/" data-content="/">÷</button>  
        </div>
    </div>
    

        <script src="calc.js"></script>
    </body>
</html>
